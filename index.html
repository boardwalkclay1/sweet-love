<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Valentine Galaxy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-world="index">

  <canvas id="heart-canvas"></canvas>

  <!-- Galaxy photos (index uses only 5–10) -->
  <div class="galaxy-photo-layer">
    <img src="assets/images/photo5.jpg" class="bg-photo bg-5" />
    <img src="assets/images/photo6.jpg" class="bg-photo bg-6" />
    <img src="assets/images/photo7.jpg" class="bg-photo bg-7" />
    <img src="assets/images/photo8.jpg" class="bg-photo bg-8" />
    <img src="assets/images/photo9.jpg" class="bg-photo bg-9" />
    <img src="assets/images/photo10.jpg" class="bg-photo bg-10" />
  </div>

  <div id="decor-layer"></div>

  <!-- Hidden SoundCloud -->
  <div class="soundcloud-wrapper">
    <iframe 
      width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2191519382&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
    </iframe>
  </div>

  <div id="app">
    <section class="scene scene-active" id="scene-index">
      <div class="scene-content intro">

        <h1 class="title fade-in">Our Valentine Galaxy</h1>

        <p class="fade-in delay-1">
          Somewhere between my longboard wheels and your roller skates,  
          the universe decided our hearts would orbit each other forever.
        </p>

        <p class="fade-in delay-2">
          This is our story—past, present, and future—  
          floating in a pink and white galaxy made just for you.
        </p>

        <div class="choice-grid floating-buttons fade-in delay-3">
          <a href="past.html" class="choice-btn float-bounce">⏳ Past</a>
          <a href="present.html" class="choice-btn float-bounce">❤️ Present</a>
          <a href="future.html" class="choice-btn float-bounce">🌙 Future</a>
        </div>

      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
